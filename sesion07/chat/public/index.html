<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat en tiempo real</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.4/socket.io.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">

    <!-- Card: login -->
    <section class="card hidden" id="login-card">
      <h1 class="card__title">Iniciar sesion</h1>
      <div class="field">
        <label for="email">Correo</label>
        <input type="email" id="email" placeholder="example@testing.com" autocomplete="off">
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="*******" autocomplete="off">
      </div>
      <button class="btn" id="login-btn">Entrar</button>
    </section>

    <!-- Card: unirse a sala -->
    <section class="card hidden" id="join-card">
      <h1 class="card__title">Unirse al chat</h1>
      <div class="field">
        <label for="room">Nombre de sala</label>
        <input type="text" id="room" placeholder="general" autocomplete="off">
      </div>
      <div class="field">
        <label for="username">Nombre de usuario</label>
        <input type="text" id="username" placeholder="Erick" autocomplete="off">
      </div>
      <button class="btn" id="join-btn">Entrar</button>
    </section>

    <!-- Card: chat -->
    <section class="card card--chat hidden" id="chat-card">
      <header class="chat__header">
        <span class="chat__room" id="chat-room"></span>
        <button class="btn btn--ghost" id="leave-btn">Salir</button>
      </header>

      <div class="chat__messages" id="messages"></div>

      <div class="chat__typing" id="typing"></div>

      <div class="chat__compose">
        <input type="text" id="message" placeholder="Escribe un mensaje..." autocomplete="off">
        <button class="btn" id="send-btn">Enviar</button>
      </div>
    </section>

  </main>

  <script src="main.js"></script>
</body>
</html>
