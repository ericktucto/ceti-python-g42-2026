[project]
name = "chat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Erick Tucto", email = "erick@ericktucto.com" }
]
requires-python = ">=3.14"
dependencies = [
    "authlib>=1.8.0",
    "fastapi[standard]>=0.142.2",
    "psycopg2-binary>=2.9.13",
    "pwdlib[argon2]>=0.3.1",
    "python-dotenv>=1.2.4",
    "python-socketio>=5.17.0",
    "sqlmodel>=0.0.47",
]

[project.scripts]
chat = "chat:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "chat:app"
