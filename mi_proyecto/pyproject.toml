[project]
name = "mi-proyecto"
version = "0.1.0"
description = "Este es mi primer proyecto con uv"
readme = "README.md"
authors = [
    { name = "Erick Tucto", email = "erick@ericktucto.com" }
]
requires-python = ">=3.14"
dependencies = [
    "requests>=2.34.2",
]

[project.scripts]
mi-proyecto = "mi_proyecto:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
